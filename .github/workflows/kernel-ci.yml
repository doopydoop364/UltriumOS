name: Kernel build and QEMU tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  llvm-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang lld xorriso qemu-system-x86 python3 curl gzip tar

      - name: Build LLVM kernel and bootable ISO
        run: make TOOLCHAIN=llvm

      - name: Run complete memory suite twice in QEMU
        run: python3 tools/qemu-memory-test.py 'ultrium test all'

      - name: Run legacy memory command twice in QEMU
        run: python3 tools/qemu-memory-test.py 'ultrium system memory test'
